<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hornet Solve — Sac State AI Student Assistant</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="Hornet Solve mascot logo"
           onerror="this.onerror=null; this.src='assets/hornet.svg';" />
    </div>
    <div class="brand">
      <h1>Hornet Solve</h1>
      <p id="tagline">AI student assistant · powered by the Sac State knowledge base</p>
    </div>
    <div class="spacer"></div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="langEn" class="lang-btn active" data-lang="en" type="button">EN</button>
      <button id="langEs" class="lang-btn" data-lang="es" type="button">ES</button>
    </div>
    <label class="student-switch">
      <span id="signedInLabel">Signed in as</span>
      <select id="studentSelect" aria-label="Choose sample student"></select>
    </label>
  </header>

  <main>
    <div id="chat" aria-live="polite"></div>

    <div class="chips" id="chips"></div>

    <form id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Ask Hornet Solve anything about Sac State…" aria-label="Message" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </main>

  <!-- Data layer -->
  <script src="src/data/schema.js"></script>
  <script src="src/data/catalog.js"></script>
  <script src="src/data/students.js"></script>
  <!-- Core + LLM -->
  <script src="src/core/i18n.js"></script>
  <script src="src/llm/provider.js"></script>
  <script src="src/core/knowledge.js"></script>
  <script src="src/core/chatEngine.js"></script>
  <!-- App (loads last) -->
  <script src="src/app.js"></script>
</body>
</html>
